# A runaway loop (e.g. a fixture angle that never ends a march) must fail
# its own test instead of hanging the whole suite; the slowest capstone
# runs in ~2 s. SEPARATE_THREAD lets the timeout fire on a CPU-bound loop.
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
